<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-label="Abstract illustration of a port terminal: quay cranes, stacked containers, a vessel and a data network above them">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFE"/><stop offset="1" stop-color="#E8F2FB"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#009FE3" stop-opacity=".22"/><stop offset="1" stop-color="#164194" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2D63"/><stop offset="1" stop-color="#164194"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#164194"/><stop offset="1" stop-color="#009FE3"/>
    </linearGradient>
  </defs>

  <rect width="820" height="540" rx="28" fill="url(#sky)"/>

  <!-- data network -->
  <g stroke="#009FE3" stroke-width="1.6" opacity=".55" fill="none">
    <path d="M96 118 L232 76 L388 128 L556 70 L724 112"/>
    <path d="M232 76 L300 168 L470 150 L556 70"/>
    <path d="M96 118 L180 206 L300 168"/>
    <path d="M470 150 L640 196 L724 112"/>
  </g>
  <g fill="#FFFFFF" stroke="#164194" stroke-width="2">
    <circle cx="96" cy="118" r="7"/><circle cx="232" cy="76" r="9"/><circle cx="388" cy="128" r="7"/>
    <circle cx="556" cy="70" r="9"/><circle cx="724" cy="112" r="7"/><circle cx="300" cy="168" r="7"/>
    <circle cx="180" cy="206" r="6"/><circle cx="470" cy="150" r="8"/><circle cx="640" cy="196" r="6"/>
  </g>
  <circle cx="232" cy="76" r="17" fill="#009FE3" opacity=".16"/>
  <circle cx="556" cy="70" r="17" fill="#F9B233" opacity=".22"/>

  <!-- water -->
  <path d="M0 420 H820 V512 a28 28 0 0 1-28 28 H28 A28 28 0 0 1 0 512 Z" fill="url(#water)"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M60 466h70"/><path d="M160 486h54"/><path d="M596 470h78"/><path d="M700 494h60"/><path d="M420 500h84"/>
  </g>

  <!-- vessel -->
  <g>
    <path d="M470 392h250l-34 54H500z" fill="url(#hull)"/>
    <rect x="690" y="342" width="30" height="50" rx="5" fill="#0B2D63"/>
    <g>
      <rect x="486" y="356" width="46" height="36" fill="#009FE3"/>
      <rect x="538" y="356" width="46" height="36" fill="#F9B233"/>
      <rect x="590" y="356" width="46" height="36" fill="#164194"/>
      <rect x="642" y="356" width="42" height="36" fill="#E84E1B"/>
      <rect x="512" y="320" width="46" height="34" fill="#164194"/>
      <rect x="564" y="320" width="46" height="34" fill="#009FE3"/>
      <rect x="616" y="320" width="46" height="34" fill="#F9B233"/>
    </g>
  </g>

  <!-- quay cranes -->
  <g fill="#0B2D63">
    <g>
      <rect x="150" y="196" width="10" height="196"/>
      <rect x="248" y="196" width="10" height="196"/>
      <rect x="120" y="186" width="230" height="14" rx="4" fill="url(#beam)"/>
      <rect x="196" y="200" width="14" height="72" fill="#164194"/>
      <rect x="180" y="266" width="46" height="34" fill="#F9B233"/>
      <rect x="120" y="386" width="146" height="10" rx="4"/>
    </g>
    <g opacity=".75">
      <rect x="326" y="230" width="9" height="162"/>
      <rect x="404" y="230" width="9" height="162"/>
      <rect x="300" y="220" width="190" height="12" rx="4" fill="url(#beam)"/>
      <rect x="362" y="232" width="12" height="58" fill="#164194"/>
      <rect x="348" y="284" width="40" height="28" fill="#009FE3"/>
      <rect x="300" y="386" width="122" height="9" rx="4"/>
    </g>
  </g>

  <!-- container yard -->
  <g>
    <rect x="52" y="352" width="72" height="26" rx="3" fill="#164194"/>
    <rect x="52" y="322" width="72" height="26" rx="3" fill="#009FE3"/>
    <rect x="52" y="292" width="72" height="26" rx="3" fill="#F9B233"/>
    <rect x="132" y="352" width="72" height="26" rx="3" fill="#E84E1B"/>
    <rect x="132" y="322" width="72" height="26" rx="3" fill="#164194"/>
    <rect x="212" y="352" width="72" height="26" rx="3" fill="#009FE3"/>
    <rect x="212" y="322" width="72" height="26" rx="3" fill="#F9B233"/>
    <rect x="292" y="352" width="72" height="26" rx="3" fill="#164194"/>
  </g>

  <!-- rail + truck lane -->
  <g stroke="#0B2D63" stroke-width="3" opacity=".35">
    <path d="M40 410h740" stroke-dasharray="26 16"/>
  </g>
  <g>
    <rect x="392" y="386" width="86" height="24" rx="4" fill="#0B2D63"/>
    <rect x="392" y="366" width="60" height="20" rx="3" fill="#009FE3"/>
    <circle cx="410" cy="414" r="7" fill="#10233D"/><circle cx="462" cy="414" r="7" fill="#10233D"/>
  </g>
</svg>
